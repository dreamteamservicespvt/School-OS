<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>School OS Assistant</title>
<link rel="icon" href="data:,">
<meta name="description" content="A live 3D School OS Assistant robot with feelings, demo questions and a voice.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --page: #dcd6ff;
  --page-bg: radial-gradient(1200px 700px at 12% -10%, #c7b6ff 0%, rgba(199,182,255,0) 60%),
             radial-gradient(1000px 700px at 100% 10%, #b3c4ff 0%, rgba(179,196,255,0) 60%),
             linear-gradient(160deg, #e3dcff 0%, #d6deff 55%, #e6d9ff 100%);
  --ink: #17143d;
  --ink-2: #474470;
  --card: rgba(255,255,255,0.78);
  --card-border: rgba(118,104,230,0.22);
  --card-shadow: 0 24px 60px -28px rgba(64,44,170,0.45);
  --chip: #ffffff;
  --chip-hover: #f3f0ff;
  --chip-ink: #211d5c;
  --chip-border: rgba(104,92,224,0.24);
  --no-ink: #8a1640;
  --no-bg: #fff2f6;
  --no-border: rgba(196,40,96,0.28);
  --accent: #5146e8;
  --accent-ink: #ffffff;
  --focus: #1f4fff;
  --bubble-q: #5146e8;
  --bubble-q-ink: #ffffff;
  --bubble-a: #f1eeff;
  --bubble-a-ink: #1d1a4a;
  --tag: #e6e1ff;
  --tag-ink: #3a2fb8;
  --stage-shadow: 0 34px 70px -30px rgba(58,36,170,0.6);
  --wave: #5a63f0;
  --pill: rgba(255,255,255,0.86);
  --pill-ink: #1b1846;
  --press: #e9e5ff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0a26;
    --page-bg: radial-gradient(1100px 700px at 10% -10%, #34217e 0%, rgba(52,33,126,0) 60%),
               radial-gradient(900px 700px at 100% 0%, #1d2d7e 0%, rgba(29,45,126,0) 60%),
               linear-gradient(160deg, #120d33 0%, #0d0f2e 55%, #170f38 100%);
    --ink: #f3f1ff;
    --ink-2: #c4c0ef;
    --card: rgba(28,23,72,0.72);
    --card-border: rgba(150,136,255,0.24);
    --card-shadow: 0 24px 60px -28px rgba(0,0,0,0.7);
    --chip: rgba(255,255,255,0.07);
    --chip-hover: rgba(255,255,255,0.13);
    --chip-ink: #eeeaff;
    --chip-border: rgba(170,156,255,0.28);
    --no-ink: #ffc1d6;
    --no-bg: rgba(255,80,140,0.10);
    --no-border: rgba(255,120,170,0.34);
    --accent: #7b72ff;
    --accent-ink: #ffffff;
    --focus: #9fc0ff;
    --bubble-q: #6a60ff;
    --bubble-q-ink: #ffffff;
    --bubble-a: rgba(255,255,255,0.08);
    --bubble-a-ink: #f1eeff;
    --tag: rgba(140,124,255,0.22);
    --tag-ink: #d9d3ff;
    --stage-shadow: 0 34px 70px -30px rgba(0,0,0,0.8);
    --wave: #8f97ff;
    --pill: rgba(18,14,52,0.78);
    --pill-ink: #f3f1ff;
    --press: rgba(140,124,255,0.25);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0a26;
  --page-bg: radial-gradient(1100px 700px at 10% -10%, #34217e 0%, rgba(52,33,126,0) 60%),
             radial-gradient(900px 700px at 100% 0%, #1d2d7e 0%, rgba(29,45,126,0) 60%),
             linear-gradient(160deg, #120d33 0%, #0d0f2e 55%, #170f38 100%);
  --ink: #f3f1ff;
  --ink-2: #c4c0ef;
  --card: rgba(28,23,72,0.72);
  --card-border: rgba(150,136,255,0.24);
  --card-shadow: 0 24px 60px -28px rgba(0,0,0,0.7);
  --chip: rgba(255,255,255,0.07);
  --chip-hover: rgba(255,255,255,0.13);
  --chip-ink: #eeeaff;
  --chip-border: rgba(170,156,255,0.28);
  --no-ink: #ffc1d6;
  --no-bg: rgba(255,80,140,0.10);
  --no-border: rgba(255,120,170,0.34);
  --accent: #7b72ff;
  --accent-ink: #ffffff;
  --focus: #9fc0ff;
  --bubble-q: #6a60ff;
  --bubble-q-ink: #ffffff;
  --bubble-a: rgba(255,255,255,0.08);
  --bubble-a-ink: #f1eeff;
  --tag: rgba(140,124,255,0.22);
  --tag-ink: #d9d3ff;
  --stage-shadow: 0 34px 70px -30px rgba(0,0,0,0.8);
  --wave: #8f97ff;
  --pill: rgba(18,14,52,0.78);
  --pill-ink: #f3f1ff;
  --press: rgba(140,124,255,0.25);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color: var(--ink);
  background-color: var(--page);
  background-image: var(--page-bg);
  overflow-x: hidden;
  line-height: 1.45;
}
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

.page { max-width: 1320px; margin: 0 auto; padding: 12px 16px 32px; }
.top { display: flex; align-items: center; justify-content: space-between; min-height: 56px; margin-bottom: 8px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; letter-spacing: -0.01em; }
.brand-mark { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center;
  background: linear-gradient(140deg, #6d5cff, #3f7bff); color: #fff; box-shadow: 0 6px 16px -6px rgba(80,70,240,.7); }
.icon-btn { min-width: 44px; min-height: 44px; border-radius: 14px; border: 1px solid var(--chip-border);
  background: var(--chip); display: inline-grid; place-items: center; cursor: pointer; }
.icon-btn:hover { background: var(--chip-hover); }

.layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
.stage-card { position: relative; border-radius: 28px; overflow: hidden; box-shadow: var(--stage-shadow);
  background: linear-gradient(170deg, #7b5cf0, #5a74ee 60%, #4b55d8); }
.stage { position: relative; width: 100%; height: 370px; }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: manipulation; cursor: default; }
.stage canvas.hot { cursor: pointer; }
.stage-fallback { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: #fff; font-weight: 600; }
.state-pill { position: absolute; left: 12px; top: 12px; margin: 0;
  display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px;
  background: var(--pill); color: var(--pill-ink); font-size: 14px; white-space: nowrap;
  box-shadow: 0 8px 24px -10px rgba(20,10,80,.5); backdrop-filter: blur(10px); }
.state-pill b { font-weight: 700; }
.state-pill .dot { width: 9px; height: 9px; border-radius: 50%; background: #34d6ff; box-shadow: 0 0 10px #34d6ff; }
.tap-hint { position: absolute; top: 12px; right: 12px; margin: 0; padding: 6px 10px; border-radius: 999px;
  background: rgba(255,255,255,.18); color: #fff; font-size: 12.5px; font-weight: 600; backdrop-filter: blur(6px); }

.panel { background: var(--card); border: 1px solid var(--card-border); border-radius: 28px;
  box-shadow: var(--card-shadow); padding: 20px 16px 18px; backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); min-width: 0; }
.demo-badge { display: inline-flex; align-items: center; gap: 6px; margin: 0 0 10px; padding: 5px 11px; border-radius: 999px;
  background: var(--tag); color: var(--tag-ink); font-size: 13px; font-weight: 700; }
.panel h1 { margin: 0; font-size: 23px; line-height: 1.2; letter-spacing: -0.02em; font-weight: 800; }
.panel h1 .hl { background: linear-gradient(90deg, #6a4dff, #3f7bff); -webkit-background-clip: text; background-clip: text; color: transparent; }
:root[data-theme="dark"] .panel h1 .hl { background-image: linear-gradient(90deg, #b9a8ff, #8fb4ff); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .panel h1 .hl { background-image: linear-gradient(90deg, #b9a8ff, #8fb4ff); } }
.lead { margin: 6px 0 14px; color: var(--ink-2); font-size: 16px; }

.chips { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: minmax(0,1fr); gap: 8px; }
.chip { width: 100%; min-height: 48px; display: flex; align-items: center; gap: 10px; text-align: left;
  padding: 10px 14px; border-radius: 16px; border: 1px solid var(--chip-border); background: var(--chip);
  color: var(--chip-ink); font-weight: 600; font-size: 15px; cursor: pointer;
  transition: background-color .15s ease, transform .15s ease, box-shadow .15s ease; }
.chip:hover { background: var(--chip-hover); box-shadow: 0 6px 16px -10px rgba(60,40,180,.5); }
.chip:active { transform: scale(.98); }
.chip .ico { flex: 0 0 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; color: #fff; }
.chip.no { margin-top: 8px; background: var(--no-bg); border-color: var(--no-border); color: var(--no-ink); font-weight: 600; }
.chip.no .ico { background: linear-gradient(140deg, #ff6f9c, #d6336c); }

.convo { margin: 14px 0 0; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
.bubble { max-width: 92%; padding: 10px 13px; border-radius: 16px; font-size: 15px; }
.bubble.q { align-self: flex-end; background: var(--bubble-q); color: var(--bubble-q-ink); border-bottom-right-radius: 6px; font-weight: 600; }
.bubble.a { align-self: flex-start; background: var(--bubble-a); color: var(--bubble-a-ink); border-bottom-left-radius: 6px; }
.bubble.a .tag { display: inline-block; margin-right: 6px; padding: 1px 8px; border-radius: 999px; background: var(--tag); color: var(--tag-ink); font-size: 12px; font-weight: 700; vertical-align: 1px; }
.bubble.a.no .tag { background: var(--no-bg); color: var(--no-ink); }
.bubble.wait { color: var(--ink-2); font-style: italic; }

.type-form { display: flex; gap: 8px; margin-top: 12px; }
.type-form[hidden] { display: none; }
.type-form input { flex: 1; min-width: 0; min-height: 48px; padding: 0 14px; border-radius: 14px; border: 1px solid var(--chip-border); background: var(--chip); color: var(--ink); font-size: 16px; }
.type-form input::placeholder { color: var(--ink-2); opacity: .85; }
.btn { min-height: 48px; padding: 0 18px; border-radius: 14px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 700; cursor: pointer; }

.voice-row { display: flex; align-items: center; justify-content: center; gap: 16px; margin-top: 16px; position: relative; }
.wave { display: none; align-items: center; gap: 3px; height: 40px; }
.wave i { display: block; width: 4px; height: 8px; border-radius: 4px; background: var(--wave); opacity: .55; transform-origin: center; }
.wave.on i { opacity: 1; animation: wv 0.9s ease-in-out infinite; }
@keyframes wv { 0%,100% { transform: scaleY(.6); } 50% { transform: scaleY(3.4); } }
.mic { width: 76px; height: 76px; border-radius: 50%; border: 0; cursor: pointer; color: #fff; display: grid; place-items: center;
  background: radial-gradient(circle at 35% 30%, #7d9bff, #3e4fe8 60%, #3125c9);
  box-shadow: 0 12px 28px -8px rgba(60,70,240,.75), 0 0 0 6px rgba(110,120,255,.18); position: relative; }
.mic[aria-pressed="true"]::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 3px solid rgba(110,150,255,.8); animation: ping 1.2s ease-out infinite; }
@keyframes ping { from { transform: scale(1); opacity: .9; } to { transform: scale(1.35); opacity: 0; } }
.kbd { width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--chip-border); background: var(--chip); cursor: pointer; display: grid; place-items: center; color: var(--chip-ink); }
.kbd[aria-expanded="true"] { background: var(--press); }
.mic-note { margin: 10px 0 0; text-align: center; font-size: 13.5px; color: var(--ink-2); min-height: 1.4em; }

.feelings { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--card-border); }
.feelings h2 { margin: 0 0 10px; font-size: 15px; font-weight: 700; letter-spacing: 0; }
.feel-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }
.feel { min-height: 52px; padding: 7px 10px; border-radius: 14px; border: 1px solid var(--chip-border); background: var(--chip); cursor: pointer; text-align: left; display: flex; flex-direction: column; justify-content: center; }
.feel b { font-size: 14.5px; font-weight: 700; color: var(--chip-ink); }
.feel span { font-size: 12.5px; color: var(--ink-2); }
.feel:hover { background: var(--chip-hover); }
.feel[aria-pressed="true"] { background: var(--press); border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.status { margin: 12px 0 0; font-size: 14px; color: var(--ink-2); }
.status b { color: var(--ink); }
.foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; }
.toggle { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font-size: 14px; color: var(--ink-2); cursor: pointer; }
.toggle input { width: 20px; height: 20px; accent-color: var(--accent); }

@media (min-width: 600px) {
  .page { padding: 16px 24px 40px; }
  .stage { height: 460px; }
  .chips { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .feel-grid { grid-template-columns: repeat(4, minmax(0,1fr)); }
}
@media (min-width: 980px) {
  .page { padding: 18px 40px 40px; }
  .layout { grid-template-columns: minmax(0, 1.08fr) minmax(0, 1fr); gap: 28px; align-items: start; }
  .stage { height: min(780px, calc(100vh - 110px)); min-height: 600px; }
  .stage-card { position: sticky; top: 16px; }
  .panel { padding: 30px 28px 24px; }
  .panel h1 { font-size: 31px; }
  .lead { font-size: 17px; }
  .wave { display: flex; position: absolute; left: 0; }
  .voice-row { justify-content: center; }
}
@media (prefers-reduced-motion: reduce) {
  .wave.on i, .mic[aria-pressed="true"]::after { animation: none; }
  .chip, .chip:active { transition: none; transform: none; }
}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",

<body>
<div class="page">
  <header class="top">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5.5c3-1.5 6.5-1.5 10 .8 3.5-2.3 7-2.3 10-.8V19c-3-1.5-6.5-1.5-10 .8-3.5-2.3-7-2.3-10-.8z"/><path d="M12 6.3v13.5"/></svg>
      </span>
      School OS
    </div>
    <button id="themeBtn" class="icon-btn" type="button" aria-label="Switch to dark theme">
      <svg id="themeIco" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <main class="layout">
    <section class="stage-card" aria-label="School OS Assistant robot">
      <div class="stage" id="stage">
        <canvas id="scene" role="img" aria-label="A cute white robot assistant with a glowing face, floating above a glowing ring"></canvas>
        <p class="stage-fallback" id="fallback" hidden>The 3D robot could not start on this device. Everything else on this page still works.</p>
      </div>
      <p class="tap-hint" aria-hidden="true">Tap me</p>
      <p class="state-pill" id="statePill" aria-hidden="true"><span class="dot"></span><b id="pillName">Idle</b><span id="pillSub">Ready to help</span></p>
    </section>

    <section class="panel" aria-labelledby="hi">
      <p class="demo-badge">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/></svg>
        Demo answers only
      </p>
      <h1 id="hi">Hi! I'm your <span class="hl">School OS Assistant</span></h1>
      <p class="lead">How can I help you today?</p>

      <ul class="chips" aria-label="Sample questions">
        <li><button class="chip" type="button" data-q="Who is absent today?"><span class="ico" style="background:linear-gradient(140deg,#7b6bff,#4f46e5)" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M17 8l4 4M21 8l-4 4"/></svg></span>Who is absent today?</button></li>
        <li><button class="chip" type="button" data-q="Show today's fee collection"><span class="ico" style="background:linear-gradient(140deg,#3fb7ff,#2563eb)" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h12M6 9h12M10 4c4 0 4 9 0 9H6l8 7"/></svg></span>Show today's fee collection</button></li>
        <li><button class="chip" type="button" data-q="Add a new student"><span class="ico" style="background:linear-gradient(140deg,#a66bff,#7c3aed)" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M19 7v6M16 10h6"/></svg></span>Add a new student</button></li>
        <li><button class="chip" type="button" data-q="Take me to class timetable"><span class="ico" style="background:linear-gradient(140deg,#2fd0c7,#0e9f9a)" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></span>Take me to class timetable</button></li>
      </ul>
      <button class="chip no" type="button" data-q="Delete all fee records"><span class="ico" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M6 6l12 12"/></svg></span>Try one it can't do: Delete all fee records</button>

      <div class="convo" id="convo" aria-live="polite"></div>

      <form class="type-form" id="typeForm" hidden>
        <label for="q" class="sr-only">Type your question</label>
        <input id="q" name="q" type="text" autocomplete="off" placeholder="Type your question" maxlength="160">
        <button class="btn" type="submit">Ask</button>
      </form>

      <div class="voice-row">
        <div class="wave" id="wave" aria-hidden="true"></div>
        <button class="mic" id="mic" type="button" aria-pressed="false" aria-label="Talk to the assistant (demo: shows Listening, the microphone is not used)">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        </button>
        <button class="kbd" id="kbd" type="button" aria-expanded="false" aria-controls="typeForm" aria-label="Type a question">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6 10h.01M9.5 10h.01M13 10h.01M16.5 10h.01M6.5 14h11"/></svg>
        </button>
      </div>
      <p class="mic-note" id="micNote">Tap a question, type one, or press the mic.</p>

      <div class="feelings">
        <h2>Feelings</h2>
        <div class="feel-grid" id="feelGrid">
          <button class="feel" type="button" data-state="idle" aria-pressed="true"><b>Idle</b><span>Ready to help</span></button>
          <button class="feel" type="button" data-state="listening" aria-pressed="false"><b>Listening</b><span>Hearing you</span></button>
          <button class="feel" type="button" data-state="thinking" aria-pressed="false"><b>Thinking</b><span>Working on it</span></button>
          <button class="feel" type="button" data-state="speaking" aria-pressed="false"><b>Speaking</b><span>Telling you</span></button>
          <button class="feel" type="button" data-state="done" aria-pressed="false"><b>Task Done</b><span>All set!</span></button>
          <button class="feel" type="button" data-state="sorry" aria-pressed="false"><b>Sorry</b><span>Can't do it</span></button>
          <button class="feel" type="button" data-state="surprised" aria-pressed="false"><b>Surprised</b><span>Oh!</span></button>
          <button class="feel" type="button" data-state="giggle" aria-pressed="false"><b>Say hi</b><span>Giggle and wave</span></button>

const CYAN = '#4ff0ff';
function drawFace(F, t) {

  fx.fillStyle = '#000'; fx.fillRect(0, 0, FW, FH);

  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(0.7, 'rgba(40,20,90,0.05)'); g.addColorStop(1, 'rgba(110,60,200,0.16)');
  fx.fillStyle = g; fx.fillRect(0, 0, FW, FH);
  // glass highlight streak (top-left), drawn faintly on the screen
  fx.save(); fx.strokeStyle = 'rgba(255,255,255,0.13)'; fx.lineWidth = 16; fx.lineCap = 'round';
  fx.beginPath(); fx.arc(FW * 0.42, FH * 0.62, FW * 0.36, Math.PI * 1.08, Math.PI * 1.36); fx.stroke();
  fx.strokeStyle = 'rgba(255,255,255,0.1)'; fx.lineWidth = 7;

  fx.restore();

  for (const side of [-1, 1]) drawEye(FW / 2 + side * ex + F.lookX, ey, side, F);
  drawMouth(FW / 2 + F.lookX * 0.45, 240 + F.lookY * 0.45, F);

}
function ell(x, y, rx, ry) { const { fx } = api; fx.beginPath(); fx.ellipse(x, y, Math.max(0.5, rx), Math.max(0.5, ry), 0, 0, Math.PI * 2); }
function drawEye(cx, cy, side, F) {
  const { fx } = api;
  const s = F.size, w = 45 * s, hFull = 58 * s, h = Math.max(4, hFull * F.open);
  const aOpen = 1 - F.happy;
  if (aOpen > 0.01) {
    fx.save();
    fx.globalAlpha = aOpen;
    if (F.sad > 0.01) {
      const outerY = cy - hFull - 4 + F.sad * hFull * 1.05;
      const innerY = cy - hFull - 4 + F.sad * hFull * 0.2;
      fx.beginPath();
      fx.moveTo(cx + side * 90, outerY + (outerY - innerY) * 0.4);
      fx.lineTo(cx - side * 90, innerY - (outerY - innerY) * 0.4);
      fx.lineTo(cx - side * 90, cy + 200); fx.lineTo(cx + side * 90, cy + 200); fx.closePath();
      fx.clip();
    }
    if (F.cheek > 0.01) {
      const Rr = w * 2.1, cyc = cy + h + Rr - F.cheek * h * 1.05;
      fx.beginPath(); fx.rect(cx - 120, cy - 160, 240, 400);
      fx.moveTo(cx + Rr, cyc); fx.arc(cx, cyc, Rr, 0, Math.PI * 2);
      fx.clip('evenodd');
    }
    fx.shadowColor = CYAN; fx.shadowBlur = 10; fx.fillStyle = CYAN;
    ell(cx, cy, w, h); fx.fill();
    fx.shadowBlur = 0;
    const core = fx.createRadialGradient(cx - w * 0.15, cy - h * 0.1, 2, cx, cy, Math.max(w, h));
    core.addColorStop(0, 'rgba(220,255,255,0.9)'); core.addColorStop(0.6, 'rgba(120,245,255,0.25)'); core.addColorStop(1, 'rgba(79,240,255,0)');
    fx.fillStyle = core; ell(cx, cy, w, h); fx.fill();
    if (F.open > 0.55) {
      fx.fillStyle = 'rgba(255,255,255,0.95)';
      ell(cx + w * 0.34, cy - h * 0.36, w * 0.24, w * 0.24 * Math.min(1, h / hFull)); fx.fill();
      ell(cx - w * 0.3, cy + h * 0.38, w * 0.1, w * 0.1 * Math.min(1, h / hFull)); fx.fill();
    }
    fx.restore();
  }
  if (F.happy > 0.01) {
    fx.save(); fx.globalAlpha = F.happy;
    fx.strokeStyle = CYAN; fx.lineWidth = 24 * Math.min(1.15, s); fx.lineCap = 'round';
    fx.shadowColor = CYAN; fx.shadowBlur = 10;
    fx.beginPath(); fx.arc(cx, cy + 30 * s, 60 * s, Math.PI * 1.15, Math.PI * 1.85); fx.stroke();
    fx.shadowBlur = 0; fx.strokeStyle = 'rgba(225,255,255,0.8)'; fx.lineWidth = 7;

    fx.restore();
  }

}
function drawMouth(mx, my, F) {
  const { fx } = api;

    const loY = my + s * 24 + o * 46;

      fx.beginPath(); fx.moveTo(mx - mw, endY);
      fx.quadraticCurveTo(mx, upY, mx + mw, endY);

      path();

    fx.shadowColor = CYAN; fx.shadowBlur = 10;
    fx.strokeStyle = CYAN; fx.lineWidth = 13; fx.stroke();
  }

    fx.globalAlpha = ro; fx.shadowColor = CYAN; fx.shadowBlur = 10;

    fx.fillStyle = 'rgba(25,120,160,0.55)'; fx.fill();
    fx.strokeStyle = CYAN; fx.lineWidth = 12; fx.stroke();
  }
  fx.restore();
}
function drawDots(a, t) {
  const { fx } = api;

function drawBlush(F, ex, ey) {
  const { fx, FW } = api;

/* ---------------- animation state ---------------- */
let state = 'idle', stateT = 0, stateTimer = null;
const C = { ...BASE_FACE }; const T = { ...BASE_FACE };
const body = { hx: 0, hy: 0, hz: 0, lean: 0, sink: 0, arcs: 0, arcsR: 0, ring: 0 };
const bodyT = { ...body };
let follow = 1, waveR = false, talkArms = false, wiggle = false;
let talk = 0, talkTarget = 0, talking = false;
let blinkT = 2 + Math.random() * 2, blinkP = 0;
let bounceY = 0, bounceV = 0, boingA = 0, boingV = 0;
const pointer = { x: 0, y: 0, last: -10 };
let t = 0;
let armTL = { ...BASE_ARM }, armTR = { ...BASE_ARM };

function setState(name, opts = {}) {
  const S = STATES[name]; if (!S) return;
  state = name; stateT = 0;
  clearTimeout(stateTimer); stateTimer = null;
  Object.assign(T, BASE_FACE, S.face || {});
  const hd = S.head || {};
  bodyT.hx = hd.x || 0; bodyT.hy = hd.y || 0; bodyT.hz = hd.z || 0;
  bodyT.lean = S.lean || 0; bodyT.sink = S.sink || 0;
  bodyT.arcs = S.arcs || 0; bodyT.arcsR = S.arcsR || 0; bodyT.ring = S.ring || 0;
  armTL = { ...BASE_ARM, ...(S.armL || {}) }; armTR = { ...BASE_ARM, ...(S.armR || {}) };
  follow = S.follow ?? 1; waveR = !!S.waveR; talkArms = !!S.talkArms; wiggle = !!S.wiggle;
  if (api && S.sparkle && !opts.noSparkle) api.burst();
  if (S.bounce && !reduced) bounceV = 2.4;
  if (S.boing && !reduced) { boingV = 9; bounceV = 1.6; }
  if (S.duration && !opts.hold) stateTimer = setTimeout(() => setState('idle'), S.duration);
  // UI
  $('#pillName').textContent = S.name; $('#pillSub').textContent = S.sub;
  $('#status').innerHTML = `<b>${S.name}:</b> ${S.sub}`;
  document.querySelectorAll('.feel').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.state === name)));
  waveEl.classList.toggle('on', name === 'listening' || name === 'speaking' || talking);
  if (name !== 'listening') { $('#mic').setAttribute('aria-pressed', 'false'); }
}

const damp = (cur, tgt, rate, dt) => cur + (tgt - cur) * (1 - Math.exp(-rate * dt));

function update(dt) {
  t += dt; stateT += dt;
  // face params
  for (const k in T) C[k] = damp(C[k], T[k], k === 'mouthOpen' ? 14 : 9, dt);
  talk = damp(talk, talkTarget, 30, dt);
  // blink
  blinkT -= dt;
  if (blinkT <= 0) { blinkP = 0.16; blinkT = 2.2 + Math.random() * 3.2; if (Math.random() < 0.2) blinkT = 0.32; }
  let blink = 1;
  if (blinkP > 0) { blinkP -= dt; const k = 1 - Math.abs((blinkP / 0.16) * 2 - 1); blink = 1 - k * 0.95; }
  const F = { ...C };
  F.open = C.open * (C.happy > 0.6 || state === 'thinking' ? 1 : blink);
  F.mouthOpen = C.mouthOpen + talk * 0.95;
  F.mouthW = C.mouthW * (1 - talk * 0.12);
  
  drawFace(F, t);

  // body params
  for (const k in bodyT) body[k] = damp(body[k], bodyT[k], 6, dt);
  const R = api;
  const moving = !reduced;
  // bounce spring
  if (moving) { const acc = -70 * bounceY - 8 * bounceV; bounceV += acc * dt; bounceY += bounceV * dt; } else { bounceY = 0; bounceV = 0; }
  const bob = moving ? Math.sin(t * 1.7) * 0.07 : 0;
  R.robot.position.y = bob + bounceY * 0.25 + body.sink;
  R.robot.rotation.z = moving ? Math.sin(t * 1.1) * 0.025 : 0;
  R.robot.rotation.x = body.lean;
  R.spot.material.opacity = 0.85 - bob * 2.5;
  R.spot.scale.setScalar(1 - bob * 0.8);

  // head
  let px = pointer.x, py = pointer.y;
  if (t - pointer.last > 3.5) { px = Math.sin(t * 0.37) * 0.45; py = Math.sin(t * 0.51) * 0.18; }
  const f = reduced ? 0 : follow;
  let hx = body.hx + py * 0.22 * f, hy = body.hy + px * 0.42 * f, hz = body.hz;
  if (wiggle && moving) hz += Math.sin(stateT * 20) * 0.09 * Math.max(0, 1 - stateT / 1.3);
  if (talking) hx += (talk - 0.3) * 0.05;
  if (state === 'listening' && moving) hz += Math.sin(t * 2.2) * 0.02;
  const hp = R.headPivot.rotation;
  hp.x = damp(hp.x, hx, 7, dt); hp.y = damp(hp.y, hy, 7, dt); hp.z = damp(hp.z, hz, 7, dt);

  // antenna
  if (moving) { const acc = -90 * boingA - 6 * boingV; boingV += acc * dt; boingA += boingV * dt; } else { boingA = 0; boingV = 0; }
  R.antenna.rotation.z = (moving ? Math.sin(t * 2.3) * 0.08 : 0) - (hp.z) * 0.6 + boingA * 0.12;
  R.antenna.rotation.x = moving ? Math.sin(t * 1.9 + 1) * 0.05 : 0;
  const pulse = 1 + 0.25 * Math.sin(t * 3);
  R.ball.material.color.copy(R.ballBase).multiplyScalar(pulse);

  // ear rings
  const lis = body.ring;
  for (const e of R.earRings) {
    const k1 = 1 + lis * (0.6 + 0.6 * Math.sin(t * 7)), k2 = 1 + lis * (0.6 + 0.6 * Math.sin(t * 7 - 1.2));
    e.r1.material.color.copy(e.b1).multiplyScalar(k1 * (1 + 0.1 * Math.sin(t * 2)));
    e.r2.material.color.copy(e.b2).multiplyScalar(k2);
    e.r1.scale.setScalar(1 + lis * 0.05 * Math.sin(t * 7));
  }
  // sound arcs
  for (const a of R.arcs) {
    const amt = a.side > 0 ? Math.max(body.arcs, body.arcsR * (talking ? 1 : 0.4)) : body.arcs;
    const ph = (t * 1.6 - a.i * 0.28) % 1;
    const wave = moving ? Math.max(0, Math.sin(ph * Math.PI)) : 0.8;
    a.m.material.opacity = amt * wave * 0.95;
    a.m.visible = a.m.material.opacity > 0.01;
  }

  // arms
  poseArm(R.armL, armTL, dt, false);
  poseArm(R.armR, armTR, dt, waveR);

  // platform
  for (const r of R.platRings) {
    const k = moving ? 0.75 + 0.35 * Math.sin(t * 1.3 - r.i * 0.7) : 0.9;
    r.m.material.color.copy(r.base).multiplyScalar(k);
    if (moving) r.m.scale.setScalar(1 + 0.012 * Math.sin(t * 1.3 - r.i * 0.7));
  }
  // motes
  if (moving) {
    for (let i = 0; i < R.MOTES; i++) { R.moteP[i * 3 + 1] += R.moteV[i] * dt; if (R.moteP[i * 3 + 1] > -0.3) R.resetMote(i, false); }
    R.motes.geometry.attributes.position.needsUpdate = true;
  }
  // sparkles
  let sl = R.getSpk();
  if (sl > 0) {
    sl -= dt; R.setSpk(sl);
    for (let i = 0; i < R.SPK; i++) {
      const v = R.spkV[i]; v.y -= 2.2 * dt; v.multiplyScalar(1 - 1.2 * dt);
      R.spkP[i * 3] += v.x * dt; R.spkP[i * 3 + 1] += v.y * dt; R.spkP[i * 3 + 2] += v.z * dt;
    }
    R.spkGeo.attributes.position.needsUpdate = true;
    R.sparkles.material.opacity = Math.min(1, sl / 0.5);
    R.sparkles.material.size = 0.2 + 0.1 * Math.abs(Math.sin(t * 14));
  } else R.sparkles.material.opacity = 0;
}

function poseArm(arm, tgt, dt, wave) {
  const c = arm.cur, s = arm.side;
  const W = wave ? { sx: -0.18, sz: 1.3, ex: -0.2, ez: 1.55, hx: 0, hy: 0, hz: 0.15 } : tgt;
  for (const k in c) c[k] = damp(c[k], W[k] ?? 0, 7, dt);
  let ez = c.ez, ex = c.ex, sx = c.sx;
  if (wave) ez += Math.sin(t * 11) * 0.38 * Math.min(1, stateT * 3);
  if (talkArms && talking) { ex += Math.sin(t * 4.2 + s) * 0.18 * (0.4 + talk); ez += Math.sin(t * 3.1 + s * 2) * 0.1; }
  if (!reduced && !wave) { sx += Math.sin(t * 1.7 + s) * 0.03; ez += Math.sin(t * 1.7 + s * 1.3) * 0.04; }
  arm.shoulder.rotation.set(sx, 0, s * c.sz);
  arm.elbow.rotation.set(ex, 0, s * ez);
  arm.hand.rotation.set(c.hx, s * c.hy, s * c.hz);
}

/* ---------------- loop ---------------- */
let raf = null, last = performance.now();
function frame(now) {
  raf = requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt);
  api.composer.render(dt);
}
if (api) {
  setState('idle');
  raf = requestAnimationFrame(frame);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (raf) cancelAnimationFrame(raf); raf = null; }
    else if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); }
  });
  setTimeout(() => { if (state === 'idle') setState('hello'); }, 500);

  // pointer follow + tap
  window.addEventListener('pointermove', (e) => {
    const r = stageEl.getBoundingClientRect();
    pointer.x = Math.max(-1, Math.min(1, (e.clientX - (r.left + r.width / 2)) / (window.innerWidth * 0.5)));
    pointer.y = Math.max(-1, Math.min(1, (e.clientY - (r.top + r.height * 0.4)) / (window.innerHeight * 0.5)));
    pointer.last = t;
    hoverCheck(e);
  }, { passive: true });
  const ray = new THREE.Raycaster(); const ndc = new THREE.Vector2();
  function hit(e) {
    const r = canvas.getBoundingClientRect();
    ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, api.camera);
    return ray.intersectObjects(api.pickables, false).length > 0;
  }
  let hoverQueued = false;
  function hoverCheck(e) {
    if (hoverQueued || e.target !== canvas) { if (e.target !== canvas) canvas.classList.remove('hot'); return; }
    hoverQueued = true;
    requestAnimationFrame(() => { hoverQueued = false; canvas.classList.toggle('hot', hit(e)); });
  }
  canvas.addEventListener('pointerdown', (e) => {
    if (hit(e)) { if (state === 'idle' || state === 'giggle' || state === 'hello' || state === 'surprised') setState('giggle'); }
  });
} else {
  // no 3D: keep the panel working
  window.__noScene = true;
}

/* ---------------- speech ---------------- */
let voices = [];
function loadVoices() { try { voices = speechSynthesis.getVoices() || []; } catch { voices = []; } }
if ('speechSynthesis' in window) { loadVoices(); speechSynthesis.addEventListener?.('voiceschanged', loadVoices); }
function pickVoice() {
  return voices.find((v) => v.lang === 'en-IN') || voices.find((v) => /en[-_]IN/i.test(v.lang)) || voices.find((v) => /India/i.test(v.name))
    || voices.find((v) => /^en/i.test(v.lang) && /Zira|Aria|Jenny|Female|Samantha|Heera|Neerja|Libby|Sonia/i.test(v.name))
    || voices.find((v) => /^en[-_]GB/i.test(v.lang)) || voices.find((v) => /^en/i.test(v.lang)) || null;
}
const syll = (w) => Math.max(1, (w.toLowerCase().match(/[aeiouy]+/g) || []).length);
let pulseTimers = [];
function clearPulses() { pulseTimers.forEach(clearTimeout); pulseTimers = []; }
function pulseWord(word) {
  const n = Math.min(4, syll(word));
  for (let i = 0; i < n; i++) {
    pulseTimers.push(setTimeout(() => { talkTarget = 0.45 + Math.random() * 0.55; }, i * 125));
    pulseTimers.push(setTimeout(() => { talkTarget = 0.06 + Math.random() * 0.14; }, i * 125 + 75));
  }
  pulseTimers.push(setTimeout(() => { talkTarget = 0.04; }, n * 125 + 40));
}
let speakToken = 0;
function stopSpeech() {
  speakToken++; clearPulses(); talking = false; talkTarget = 0;
  try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch {}
  waveEl.classList.toggle('on', state === 'listening');
}
function speak(text) {
  stopSpeech();
  const my = ++speakToken;
  talking = true; waveEl.classList.add('on');
  return new Promise((resolve) => {
    let finished = false, gotBoundary = false, simRunning = false;
    const words = text.split(/\s+/).filter(Boolean);
    const finish = () => {
      if (finished) return; finished = true;
      clearTimeout(maxTimer); clearTimeout(watch);
      if (my === speakToken) { clearPulses(); talking = false; talkTarget = 0; waveEl.classList.toggle('on', state === 'listening'); }
      resolve(my === speakToken);
    };
    const simulate = (loop) => {
      if (simRunning) return; simRunning = true;
      let at = 0;
      const run = () => {
        at = 0;
        words.forEach((w) => {
          pulseTimers.push(setTimeout(() => { if (my === speakToken && !finished) pulseWord(w); }, at));
          at += 110 + syll(w) * 130 + (/[,;]$/.test(w) ? 170 : 0) + (/[.!?]$/.test(w) ? 320 : 0);
        });
        pulseTimers.push(setTimeout(() => { if (finished || my !== speakToken) return; if (loop) run(); else finish(); }, at + 120));
      };
      run();
    };
    const maxTimer = setTimeout(finish, text.length * 95 + 5000);
    let watch = null;
    const voiceOn = $('#voiceOn').checked && 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined';
    if (!voiceOn) { simulate(false); return; }
    try {
      const u = new SpeechSynthesisUtterance(text);
      const v = pickVoice(); if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'en-IN';
      u.rate = 1.06; u.pitch = 1.3;
      u.onboundary = (e) => {
        if (my !== speakToken) return;
        if (e.name && e.name !== 'word') return;
        gotBoundary = true;
        if (simRunning) return;
        const m = text.slice(e.charIndex).match(/^[^\s]+/); pulseWord(m ? m[0] : 'a');
      };
      u.onend = finish; u.onerror = () => { if (!simRunning) simulate(false); };
      // if the voice never starts or gives no word events, move the mouth anyway
      watch = setTimeout(() => { if (!gotBoundary && !finished) simulate(speechSynthesis.speaking); }, 700);
      speechSynthesis.speak(u);
    } catch { simulate(false); }
  });
}

/* ---------------- demo conversation ---------------- */
const convo = $('#convo');
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
function answerFor(q) {
  if (/\b(delete|remove|erase|wipe|clear)\b/i.test(q)) return { no: true,
    text: "Sorry, I can't do that. Fee payments are never deleted in School OS, and I only do what your role allows.",
    say: "Sorry, I can't do that. Fee payments are never deleted in School OS." };
  if (/absent/i.test(q)) return { text: '3 students are absent today: 2 in Class 6 A and 1 in Class 8 B.', say: '3 students are absent today. 2 in Class 6 A, and 1 in Class 8 B.' };
  if (/fee/i.test(q)) return { text: "Today's fee collection is ₹42,500 from 17 payments.", say: "Today's fee collection is 42,500 rupees, from 17 payments." };
  if (/student/i.test(q)) return { text: "I'll open the New Student form. You fill in the details, and I check them before saving.", say: "Sure! I'll open the New Student form for you." };
  if (/timetable|time table/i.test(q)) return { text: 'Opening the Class Timetable page for you.', say: 'Opening the Class Timetable page for you.' };
  return { text: "In the real app I would look this up in your school's records. This demo only knows the sample questions.", say: 'In the real app, I would look this up for you. This demo only knows the sample questions.' };
}
function bubble(cls, html) { const d = document.createElement('div'); d.className = 'bubble ' + cls; d.innerHTML = html; convo.appendChild(d); return d; }
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let flow = 0;
async function ask(q) {
  const my = ++flow; stopSpeech();
  convo.innerHTML = '';
  bubble('q', esc(q));
  $('#micNote').textContent = 'Demo: the assistant answers with sample data.';
  setState('listening'); await wait(900); if (my !== flow) return;
  const w = bubble('a wait', 'Working on it…');
  setState('thinking'); await wait(1200); if (my !== flow) return;
  const a = answerFor(q);
  w.className = 'bubble a' + (a.no ? ' no' : '');
  w.innerHTML = `<span class="tag">${a.no ? 'Not allowed' : 'Demo answer'}</span>${esc(a.text)}`;
  if (a.no) {
    setState('sorry'); await speak(a.say); if (my !== flow) return;
    stateTimer = setTimeout(() => { if (my === flow) setState('idle'); }, 1800);
  } else {
    setState('speaking'); await speak(a.say); if (my !== flow) return;
    setState('done');
  }
}

document.querySelectorAll('.chip[data-q]').forEach((b) => b.addEventListener('click', () => ask(b.dataset.q)));
$('#typeForm').addEventListener('submit', (e) => {
  e.preventDefault(); const v = $('#q').value.trim(); if (!v) { $('#q').focus(); return; }
  $('#q').value = ''; ask(v);
});
$('#kbd').addEventListener('click', () => {
  const f = $('#typeForm'); const open = f.hidden; f.hidden = !open;
  $('#kbd').setAttribute('aria-expanded', String(open));
  if (open) $('#q').focus();
});
$('#mic').addEventListener('click', () => {
  const on = $('#mic').getAttribute('aria-pressed') !== 'true';
  flow++; stopSpeech();
  if (on) {
    setState('listening'); $('#mic').setAttribute('aria-pressed', 'true');
    $('#micNote').textContent = "Listening (demo only: the microphone isn't used). Tap a question or type one.";
  } else { setState('idle'); $('#micNote').textContent = 'Tap a question, type one, or press the mic.'; }
});
document.querySelectorAll('.feel').forEach((b) => b.addEventListener('click', async () => {
  const s = b.dataset.state; const my = ++flow; stopSpeech();
  setState(s);
  if (s === 'speaking') {
    await speak("Hello! I'm your School OS Assistant. I can help with attendance, fees and timetables.");
    if (my === flow && state === 'speaking') setState('idle');
  }
}));
$('#voiceOn').addEventListener('change', () => { if (!$('#voiceOn').checked) { try { speechSynthesis.cancel(); } catch {} } });

/* theme */
function syncThemeBtn() {
  const th = effectiveTheme();
  $('#themeBtn').setAttribute('aria-label', th === 'dark' ? 'Switch to light theme' : 'Switch to dark theme');
  $('#themeIco').innerHTML = th === 'dark'
    ? '<circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/>'
    : '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>';
  if (api) api.paintBg(th);
}
$('#themeBtn').addEventListener('click', () => {
  document.documentElement.dataset.theme = effectiveTheme() === 'dark' ? 'light' : 'dark';
  syncThemeBtn();
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncThemeBtn);
syncThemeBtn();

/* test hook */
window.__mascot = { face: () => api && api.fx.canvas.toDataURL(), dbg: () => api, setState: (s, o) => { flow++; stopSpeech(); setState(s, o); }, speak, ask, get state() { return state; },
  setTalk: (on) => { talking = on; if (on) { talkTarget = 0.85; } else talkTarget = 0; } };
</script>
</body>
