<title>School OS Test Fixes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--bg:#f6f7f9;--fg:#15202b;--mut:#5b6672;--card:#fff;--line:#dde2e8;--bar:#e6eaef;--acc:#1f6f5c;--run:#b26a00;--done:#1f7a3d;--wait:#6b7480}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161c;--fg:#e8edf2;--mut:#9aa6b2;--card:#18212a;--line:#2a3541;--bar:#2a3541;--acc:#4fc3a1;--run:#f0b04a;--done:#5bd28a;--wait:#9aa6b2;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10161c;--fg:#e8edf2;--mut:#9aa6b2;--card:#18212a;--line:#2a3541;--bar:#2a3541;--acc:#4fc3a1;--run:#f0b04a;--done:#5bd28a;--wait:#9aa6b2;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:760px;margin:0 auto;display:grid;gap:14px}
h1{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:0}
.now{font-size:19px;font-weight:600}
.bar{height:14px;background:var(--bar);border-radius:7px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.big .bar{height:22px}
.row{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:6px}
.top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.name{font-weight:600}
.tag{font-size:12px;font-weight:600}.Done{color:var(--done)}.Running{color:var(--run)}.Checking{color:var(--run)}.Waiting{color:var(--wait)}
.row p{margin:0;color:var(--mut);font-size:14px}.sm{color:var(--mut);font-size:14px;margin:4px 0 0}
</style>
<main>
<h1>School OS UI fixes</h1>
<div class="now" id="now"></div>
<div class="big"><div class="bar"><i id="mainbar"></i></div><p class="sm" id="mainline"></p></div>
<div id="rows" style="display:grid;gap:10px"></div>
<p class="sm"><b>Waiting on you:</b> <span id="wait"></span></p>
</main>
<script>
var S={
now:"Finished. 5 local commits, not pushed or deployed",
main:100,mainline:"16 of 16 notes fixed in code (15 only partly); live site changes after you push and deploy",
rows:[
[" ",100,"Done","Fixed: the card now updates the moment the admin signs in"],
[" ",100,"Done","One time format everywhere: 7:00 AM to 8:00 AM, receipts 3:17 PM"],
[" ",100,"Done","Pop-up forms keep a draft until saved, with 'Draft kept' and Clear. Never keeps passwords, codes, UTR or Aadhaar"],
[" ",100,"Done","Every missing box goes red at once; cursor jumps to the first; closed sections open. 6 forms + all shared forms"],
[" ",100,"Done","Ticking a subject no longer makes her class teacher; the server refuses a second class-teacher section"],
[" ",100,"Done","Fixed in code: Vercel had no Chrome to make PDFs; test still to run"],
[" ",100,"Done","'Class teacher of' and 'Subjects taught' shown apart, based on the role; taken ones greyed with the name. Menus no longer cut off (34 places)"],
[" ",100,"Done","Built: Dream Team's shared number (default) or the school's own; changeable later"],
[" ",100,"Done","Built: per-school card (number, status, sent, failed, credits) and a dashboard list"],
[" ",100,"Done","Same cause as 6; all 38 PDF routes fixed, a printable page shows if a PDF fails"],
[" ",100,"Done","Digits only, exactly 12, on screen and on the server; same on 8 other money screens"],
[" ",100,"Done","Countdown removed; the lock stays for safety; Forgot password still works"],
[" ",100,"Done","Cause: team phone numbers shared by several logins. The password now picks the right one"],
[" ",100,"Done","Cause: Admin/Principal logins had no staff record, so notices skipped them. Fixed; bell checks every 30 s; sound with On/Off"],
[" ",100,"Done","One share menu with the 3 choices on 7 kinds of link"],
[" ",100,"Done","Long help lines cut on the busiest forms; legal and consent text kept"],
[" ",100,"Done","The screen now says if the code really went. Meta needs an approved code template"],
["Tests, typecheck, build",100,"Done","Full suite 2572 of 2572; then 333 of 333 after the template change; type check clean; build passed"],
["Self-test in the browser",100,"Done","7 of 7 checks passed on the local app"]],
wait:"Push and deploy when you are ready (I will not push without you)."};
document.getElementById("now").textContent="Now doing: "+S.now;
document.getElementById("mainbar").style.width=S.main+"%";
document.getElementById("mainline").textContent=S.mainline;
document.getElementById("wait").textContent=S.wait;
document.getElementById("rows").innerHTML=S.rows.map(function(r){return '<div class="row"><div class="top"><span class="name">'+r[0]+'</span><span class="tag '+r[2]+'">'+r[2]+' · '+r[1]+'/100</span></div><div class="bar"><i style="width:'+r[1]+'%"></i></div><p>'+r[3]+'</p></div>'}).join("");
</script>
